services:
  - type: web
    name: urbideas-scraper
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:scraper
    startCommand: node scripts/runner.js
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
    cron: "0 3 1 * *"  # Monthly at 3 AM on the 1st
